[project]
name = "mofy-phase1"
version = "0.1.0"
description = "MOFY Phase 1: ByteTrack 추적 + 트랙 기반 모자이크"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "pillow>=10",
    "scipy>=1.10",          # 있으면 Hungarian 할당, 없으면 greedy fallback
    "torch>=2.0",           # 기존 baseline (Phase 2에서 onnxruntime으로 이전)
    "facenet-pytorch>=2.5", # 기존 MTCNN/InceptionResnetV1 (Phase 2에서 교체)
    "onnxruntime>=1.17",    # Phase 2 준비
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
